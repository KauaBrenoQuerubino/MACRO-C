<section>
    <div class="container">

        <div class="atalho">
            <p (click)="irPara('dashboard')"><i class="bi bi-grid-1x2-fill"></i>Dashboard</p> 
            > 
            <p (click)="ServicoFoiSelecionado = false" [ngClass]="{ 'servicoNaoAtivo': ServicoFoiSelecionado == false }">Sistemas</p>  
            @if (micro && ServicoFoiSelecionado) { > <p class="servicoAtivo">{{micro.nome}}</p>}

        </div>


        <div class="row">
            <h1>Sistemas</h1>
            <button (click)="cadastrarServico()" class="add-btn">+ adicionar servicos</button>
        </div>
        <div class="row"> 
            <div class="servicos">
                @if(ServicoFoiSelecionado) {
                    <app-gerenciamento 
                    [servico]="micro"
                     />
                }@else {
                    <app-servicos (Dado)="gerenciarMicro($event)" />
                }
            </div>
        </div>

    </div>
</section>
